version: '3.8'

# Sobe apenas o banco de dados local para desenvolvimento.
# Backend e worker rodam via `npm run dev` / `npm run worker` (ver README.md).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: imob_automacao
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - imob_pgdata:/var/lib/postgresql/data

volumes:
  imob_pgdata:
